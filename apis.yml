apis:
- name: Planhat REST API
  description: >-
    Planhat's REST API for reading and writing every core Customer Platform
    object — companies, end users, licenses, conversations, notes, tasks,
    opportunities, deals, sales, invoices, assets, issues, tickets, projects,
    NPS, churn, metrics and custom models — plus bulk upsert. Bearer-token
    (Private App) authenticated; limit/offset pagination.
  humanURL: https://www.planhat.com/developers/api/introduction
  baseURL: https://api.planhat.com
  tags:
  - Customer Success
  - REST
  - Customer Platform
