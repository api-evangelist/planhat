- name: Planhat Analytics API
  description: >-
    High-throughput tracking endpoint for pushing user activities and product
    usage metrics into Planhat. Addressed by tenant UUID in the URL path (open /
    tenant-scoped), separate from the main authenticated REST API.
  humanURL: https://www.planhat.com/developers/api/user-activities
  baseURL: https://analytics.planhat.com
