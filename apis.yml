aid: planhat
name: Planhat
description: >-
  Planhat is a Customer Platform that unifies customer success, product usage,
  revenue and post-sales operations for B2B SaaS companies. It centralizes
  companies, end users, licenses, conversations, NPS, health scores and
  time-series usage metrics, then drives playbooks, automations and revenue
  workflows on top of that data. Planhat exposes a REST API (api.planhat.com), a
  separate high-throughput analytics/tracking endpoint (analytics.planhat.com),
  bulk upsert, an OAuth authorization server, and a remote MCP server
  (api.planhat.com/v1/mcp) for AI agents. Backed by Creandum and added to the
  API Evangelist network; this profile was enriched from Planhat's public
  developer surface.
